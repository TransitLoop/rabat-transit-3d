<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rabat Transit 3D</title>
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.29.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.29.0/mapbox-gl.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --panel: #f4f1ea;
            --panel-border: rgba(0, 0, 0, 0.06);
            --ink: #1b1b1b;
            --muted: #6f6c66;
            --line: rgba(0, 0, 0, 0.08);
            --blue: #2f6bff;
            --tram: #c43b8c;
            --bus: #2f7de1;
            --train: #e08a1e;
            --hover: rgba(255, 255, 255, 0.55);
            --page: #eceae4;
        }

        html.night {
            --panel: #1a1c20;
            --panel-border: rgba(255, 255, 255, 0.08);
            --ink: #f4f1ea;
            --muted: #a39e95;
            --line: rgba(255, 255, 255, 0.08);
            --hover: rgba(255, 255, 255, 0.07);
            --page: #101218;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--ink);
            overflow: hidden;
            background: var(--page);
        }

        #map {
            position: absolute;
            inset: 0;
        }

        #map .mapboxgl-canvas {
            cursor: grab;
        }

        #map .mapboxgl-canvas:active {
            cursor: grabbing;
        }

        .control-panel {
            position: absolute;
            top: 16px;
            left: 16px;
            width: 292px;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 22px;
            padding: 8px 8px 12px;
            box-shadow: 0 12px 40px rgba(30, 30, 20, 0.12);
            z-index: 1000;
        }

        .view-switch {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 6px 6px 10px;
            border-bottom: 1px solid var(--line);
        }

        .view-option {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            border: 0;
            background: transparent;
            padding: 8px 10px;
            border-radius: 12px;
            font: inherit;
            font-size: 15px;
            font-weight: 500;
            color: var(--muted);
            cursor: pointer;
            text-align: left;
        }

        .view-option.active {
            color: var(--ink);
        }

        .view-option:hover {
            background: var(--hover);
        }

        .radio {
            width: 16px;
            height: 16px;
            border: 1.5px solid var(--ink);
            border-radius: 50%;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            background: var(--panel);
        }

        .view-option.active .radio::after,
        .legend-item.active .radio::after {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--ink);
        }

        .panel-section {
            padding: 12px 12px 4px;
        }

        .section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 2px;
        }

        .section-head h2,
        .panel-section h2 {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .pill {
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--ink);
            font: inherit;
            font-size: 11px;
            font-weight: 500;
            padding: 4px 9px;
            border-radius: 999px;
            cursor: pointer;
        }

        .pill:hover { background: var(--hover); }

        .playback-meta {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.35;
        }

        .playback-meta.active {
            color: #1f7a46;
        }

        .playback-sub {
            font-size: 11px;
            color: #8a8680;
            line-height: 1.4;
            margin: 6px 0 12px;
        }

        .playback-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .icon-btn {
            width: 28px;
            height: 28px;
            border: 0;
            background: transparent;
            color: var(--ink);
            cursor: pointer;
            display: grid;
            place-items: center;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .icon-btn:hover { background: var(--hover); }

        .icon-btn svg {
            width: 16px;
            height: 16px;
            display: block;
        }

        .time-label {
            font-size: 14px;
            color: var(--ink);
            font-variant-numeric: tabular-nums;
        }

        .time-label strong {
            font-weight: 600;
        }

        .time-slider {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 3px;
            border-radius: 99px;
            background: #d9d4cb;
            outline: none;
            margin: 4px 0 8px;
        }

        .time-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--blue);
            border: 2px solid #fff;
            box-shadow: 0 0 0 1px rgba(47, 107, 255, 0.3);
            cursor: pointer;
        }

        .time-slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--blue);
            border: 2px solid #fff;
            cursor: pointer;
        }

        .speed-label {
            font-size: 12px;
            color: var(--muted);
            margin: 10px 0 6px;
        }

        .speed-buttons {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
        }

        .speed-buttons button {
            flex: 1;
            border: 0;
            background: transparent;
            color: #9a958c;
            font: inherit;
            font-size: 13px;
            font-weight: 500;
            padding: 4px 0;
            cursor: pointer;
            border-radius: 8px;
        }

        html.night .speed-buttons button {
            color: #7d7972;
        }

        .speed-buttons button.active {
            color: var(--ink);
        }

        .speed-buttons button:hover {
            background: var(--hover);
        }

        .theme-buttons {
            display: flex;
            gap: 3px;
            margin: 8px 4px 2px;
            padding: 3px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 14px;
        }

        html.night .theme-buttons {
            background: rgba(255, 255, 255, 0.07);
        }

        .theme-buttons button {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            border: 0;
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-size: 11px;
            font-weight: 500;
            padding: 7px 4px 6px;
            cursor: pointer;
            border-radius: 11px;
        }

        .theme-buttons button svg {
            width: 16px;
            height: 16px;
            display: block;
        }

        .theme-buttons button:hover {
            background: var(--hover);
            color: var(--ink);
        }

        .theme-buttons button.active {
            background: #fff;
            color: var(--ink);
            box-shadow: 0 1px 4px rgba(20, 20, 16, 0.12);
        }

        html.night .theme-buttons button.active {
            background: #2c3038;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
        }

        .filters {
            padding: 4px 6px 6px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            border: 0;
            background: transparent;
            padding: 9px 10px;
            border-radius: 12px;
            font: inherit;
            font-size: 14px;
            font-weight: 500;
            color: var(--muted);
            cursor: pointer;
            text-align: left;
        }

        .legend-item.active { color: var(--ink); }
        .legend-item:hover { background: var(--hover); }

        .legend-item .swatch {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-left: auto;
        }

        .legend-item .count {
            min-width: 28px;
            text-align: right;
            font-variant-numeric: tabular-nums;
            font-size: 13px;
            color: var(--muted);
        }

        .legend-item.active .count { color: var(--ink); }

        .stops-note {
            padding: 4px 16px 8px;
            font-size: 11px;
            color: #8a8680;
        }

        .loading-overlay {
            position: fixed;
            inset: 0;
            background: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            pointer-events: auto;
            transition: opacity 0.4s, visibility 0.4s;
        }

        html.night .loading-overlay {
            background: transparent;
        }

        .loading-overlay.fatal {
            background: var(--page);
        }

        .loading-card {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            padding: 22px 24px 18px;
            box-shadow: 0 12px 40px rgba(30, 30, 20, 0.16);
            text-align: center;
            min-width: 228px;
        }

        .loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loading-spinner {
            width: 28px;
            height: 28px;
            margin: 0 auto;
            border: 2px solid #d7d2c8;
            border-top-color: var(--ink);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            margin-top: 14px;
            font-size: 14px;
            font-weight: 500;
        }

        .loading-subtext {
            margin-top: 4px;
            font-size: 12px;
            color: var(--muted);
        }

        .mapboxgl-canvas { cursor: grab; }
        .mapboxgl-canvas:active { cursor: grabbing; }

        .mapboxgl-ctrl-top-right { top: 16px; right: 16px; }
        .mapboxgl-ctrl-bottom-right { right: 12px; bottom: 28px; }

        .mapboxgl-ctrl-group {
            border-radius: 10px !important;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(30, 30, 20, 0.12) !important;
            border: 1px solid rgba(0, 0, 0, 0.06);
        }

        .mapboxgl-ctrl-group button { width: 32px; height: 32px; }

        .mapboxgl-popup-content {
            border-radius: 12px;
            padding: 12px 14px;
            font-family: Inter, sans-serif;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        html.night .mapboxgl-popup-content {
            background: #1a1c20;
            color: var(--ink);
        }

        html.night .mapboxgl-ctrl-group {
            background: #1c1e24;
            border-color: rgba(255, 255, 255, 0.08);
        }

        html.night .mapboxgl-ctrl-group button {
            filter: invert(1);
        }

        html.night .playback-sub {
            color: #8d8880;
        }

        .vehicle-popup h4 {
            margin: 0 0 6px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .vehicle-popup .route-badge {
            display: inline-block;
            padding: 1px 7px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 12px;
        }

        .vehicle-popup p {
            margin: 0;
            font-size: 12px;
            color: var(--muted);
        }

        @media (max-width: 768px) {
            .control-panel {
                top: auto;
                bottom: 12px;
                left: 10px;
                right: 10px;
                width: auto;
                max-height: 48vh;
                overflow-y: auto;
            }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loading">
        <div class="loading-card">
            <div class="loading-spinner"></div>
            <div class="loading-text">Loading Rabat transit</div>
            <div class="loading-subtext">Fetching routes and schedules…</div>
        </div>
    </div>

    <div id="map"></div>

    <aside class="control-panel">
        <div class="view-switch">
            <button type="button" class="view-option active" id="view3d">
                <span class="radio"></span>
                Street level
            </button>
            <button type="button" class="view-option" id="view2d">
                <span class="radio"></span>
                2D map
            </button>
            <div class="theme-buttons" id="themeButtons">
                <button type="button" data-theme="auto" class="active" aria-label="Auto theme">
                    <svg viewBox="0 0 16 16" aria-hidden="true">
                        <circle cx="8" cy="8" r="6.1" fill="none" stroke="currentColor" stroke-width="1.4"/>
                        <path d="M8 1.9a6.1 6.1 0 0 0 0 12.2z" fill="currentColor"/>
                    </svg>
                    Auto
                </button>
                <button type="button" data-theme="day" aria-label="Light mode">
                    <svg viewBox="0 0 16 16" aria-hidden="true">
                        <circle cx="8" cy="8" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/>
                        <path d="M8 1.6v1.6M8 12.8v1.6M1.6 8h1.6M12.8 8h1.6M3.3 3.3l1.1 1.1M11.6 11.6l1.1 1.1M3.3 12.7l1.1-1.1M11.6 4.4l1.1-1.1" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                    </svg>
                    Light
                </button>
                <button type="button" data-theme="night" aria-label="Dark mode">
                    <svg viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M13.2 9.4A5.3 5.3 0 0 1 6.6 2.8 5.4 5.4 0 1 0 13.2 9.4z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                    </svg>
                    Dark
                </button>
            </div>
        </div>

        <section class="panel-section">
            <div class="section-head">
                <h2>Playback</h2>
                <button type="button" class="pill" id="resetBtn">Now</button>
            </div>
            <p class="playback-meta active" id="liveBadge">Live</p>
            <p class="playback-sub" id="themeNote">Matching sunrise and sunset</p>
            <p class="playback-sub" id="currentDate">Rabat–Salé–Témara timetable</p>

            <div class="playback-row">
                <button type="button" class="icon-btn" id="playBtn" aria-label="Pause">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="4" height="12" rx="1"/><rect x="9" y="2" width="4" height="12" rx="1"/></svg>
                </button>
                <span class="time-label">Time <strong id="currentTime">00:00:00</strong></span>
            </div>
            <input type="range" class="time-slider" id="timeSlider" min="0" max="86400" value="32400" step="60">

            <p class="speed-label">Playback speed</p>
            <div class="speed-buttons">
                <button type="button" data-speed="1" class="active">1×</button>
                <button type="button" data-speed="10">10×</button>
                <button type="button" data-speed="60">60×</button>
                <button type="button" data-speed="300">5 min</button>
            </div>
        </section>

        <div class="filters">
            <button type="button" class="legend-item active" data-type="tram">
                <span class="radio"></span>
                Tram
                <span class="count" id="tramCount">0</span>
                <span class="swatch" style="background: var(--tram);"></span>
            </button>
            <button type="button" class="legend-item active" data-type="bus">
                <span class="radio"></span>
                Bus
                <span class="count" id="busCount">0</span>
                <span class="swatch" style="background: var(--bus);"></span>
            </button>
            <button type="button" class="legend-item active" data-type="train">
                <span class="radio"></span>
                Train
                <span class="count" id="trainCount">0</span>
                <span class="swatch" style="background: var(--train);"></span>
            </button>
        </div>
        <p class="stops-note"><span id="stopCount">0</span> stops</p>
    </aside>

    <script src="config.js?v=theme-icons"></script>
    <script src="app.js?v=camera-orbit"></script>
</body>
</html>
